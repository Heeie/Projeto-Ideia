<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="css/login.css">
    <script src="Javascript/login.js" defer></script>
</head>

<body>

    <div class="low_body">

        <img id="lampada"
             src="images/lampada-de-ideia.png"
             alt="Lampada"
             onclick="location.href='capa.html'">

        <div id="dform">

            <h1>Login</h1>

            <form id="formu">

                <label for="nome">Nome de utilizador:</label><br>
                <input type="text"
                       id="nome"
                       name="nome"
                       placeholder="Escreve o teu nome">
                <br><br>

                <label for="password">Qual vai ser a palavra-passe da conta?</label><br>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Escreve a password">
                <br><br>

                <input id="subme"
                       type="submit"
                       value="Submeter">

            </form>

        </div>

    </div>


</body>
</html>
