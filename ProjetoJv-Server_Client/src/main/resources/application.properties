# H2 file database for local development. Override the URL and credentials with
# environment-specific values when deploying the application.
spring.datasource.url=${IDEIAS_DB_URL:jdbc:h2:file:./data/ideias;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${IDEIAS_DB_USER:sa}
spring.datasource.password=${IDEIAS_DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never
server.error.include-stacktrace=never
