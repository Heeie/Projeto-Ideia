<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registo</title>

    <link rel="stylesheet" href="css/forms_Registo.css">
     <script src="Javascript/registro.js" defer></script>
</head>

<body>

    <div class="low_body">

        <img id="lampada"
             src="images/lampada-de-ideia.png"
             alt="Lampada"
             onclick="location.href='capa.html'">

        <div id="dform">

            <h1>Formulário de Registo</h1>

            <form id="formu" action="">

                <label for="nome">Nome de utilizador:</label><br>
                <input type="text"
                       id="nome"
                       name="nome"
                       placeholder="Nome de utilizador"
                       required>
                <br><br>

                <label for="email">Email do utilizador:</label><br>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="exemplo@email.com"
                       required>
                <br><br>

                <label for="password">Qual vai ser a palavra-passe da conta?</label><br>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Escreve a password"
                       required>
                <br><br>

                <input id="subme"
                       type="submit"
                       value="Submeter">

            </form>

        </div>

    </div>

    

</body>

</html>
