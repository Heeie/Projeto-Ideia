<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registo</title>

    <link rel="stylesheet" href="css/forms_Registo.css">
     <script src="Javascript/registro.js" defer></script>
</head>

<body>

    <div class="low_body">

        <img id="lampada"
             src="images/lampada-de-ideia.png"
             alt="Lampada"
             onclick="location.href='capa.html'">

        <div id="dform">

            <h1>Formulário de Registo</h1>

           <form id="formu">

            <label for="nome">Nome de utilizador</label>
            <input type="text"
                id="nome"
                name="nome"
                placeholder="Nome de utilizador"
                required>

            <label for="email">Email do utilizador</label>
            <input type="email"
                id="email"
                name="email"
                placeholder="exemplo@email.com"
                required>

            <label for="password">Palavra-passe</label>
            <input type="password"
                id="password"
                name="password"
                placeholder="Escreve a password"
                required>

            <input id="subme"
                type="submit"
                value="Registar">

        </form>

        </div>

    </div>

    

</body>

</html>
