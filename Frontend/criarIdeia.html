<!DOCTYPE html>
<html>

<head>
<link rel="stylesheet" href="css/criarIdeia.css">
<script src="Javascript/CriarIdeia..js" defer></script>

</head>
<body>
    

    <div class="low_body">
        <img class="" 
        id="lampada" 
        src="images/lampada-de-ideia.png" 
        alt=""
        onclick="location.href='body.html'"
        >
        <div id="dform">
            <h1>Criar Ideia</h1>
            <form action="" id="formu">
                <label for="fname">Título da Ideia?:</label><br>
                <input
                    type="text"
                    id="ideia"
                    name="ideia"
                    placeholder="Título da ideia"
                    required>

                <label for="lname">Descrição de Ideia</label><br>
                
               <textarea id="descri" name="descri" rows="6"></textarea> <br><br>

                <label for="lname">Insira uma imagem aqui</label><br>
                <input
                    type="file"
                    id="img"
                    name="img"
                    accept="image/*">

                <input id="subme" type="submit" value="Submeter">
            </form>


            <div id="listAlbuns">

            </div>
            
            
        </div>
         
        

    </div>
</body>  

</html>
