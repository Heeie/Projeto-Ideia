<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil</title>

    <link rel="stylesheet" href="css/perfil.css">
</head>

<body>

    <!-- LOGO -->

    <img id="lampada"
         src="images/lampada-de-ideia.png"
         alt="Lâmpada"
         onclick="location.href='body.html'">


    <main class="perfil-container">


        <!-- =========================
             INFORMAÇÕES DO UTILIZADOR
        ========================== -->

        <section id="dform">

            <div class="section-title">

                <span class="icone">👤</span>

                <div>
                    <h1>Informação do Utilizador</h1>
                    <p>Consulta e altera os teus dados pessoais.</p>
                </div>

            </div>


            <!-- MODO DE VISUALIZAÇÃO -->

            <div id="dadosUtilizador">

                <div class="info-card">

                    <span class="info-label">
                        Nome
                    </span>

                    <span class="info-value" id="nomeInfo">
                        Sonhador
                    </span>

                </div>


                <div class="info-card">

                    <span class="info-label">
                        Email
                    </span>

                    <span class="info-value" id="emailInfo">
                        sonhador@email.com
                    </span>

                </div>

            </div>


            <button class="botao"
                    id="formInfo">

                ✏️ Alterar Informações

            </button>


            <!-- FORMULÁRIO -->

            <form id="formu">

                <label for="nome">
                    Nome
                </label>

                <input type="text"
                       id="nome"
                       name="nome"
                       value="Sonhador"
                       required>


                <label for="email">
                    Email
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       value="sonhador@email.com"
                       required>


                <div class="form-buttons">

                    <button type="button"
                            id="cancelar">

                        Cancelar

                    </button>

                    <button id="subme"
                            type="submit">

                        Guardar alterações

                    </button>

                </div>

            </form>

        </section>



        <!-- =========================
             CONFIGURAÇÕES
        ========================== -->

        <section class="infoSection">

            <div class="section-title">

                <span class="icone">⚙️</span>

                <div>

                    <h1>Configurações</h1>

                    <p>
                        Personaliza a tua conta e as tuas preferências.
                    </p>

                </div>

            </div>


            <div class="config-list">

                <button class="config-button">

                    <span>
                        👤
                    </span>

                    <div>
                        <strong>Alterar Informações</strong>
                        <small>
                            Atualiza os teus dados pessoais
                        </small>
                    </div>

                    <b>›</b>

                </button>


                <button class="config-button">

                    <span>
                        🔒
                    </span>

                    <div>
                        <strong>Alterar Palavra-passe</strong>
                        <small>
                            Mantém a tua conta segura
                        </small>
                    </div>

                    <b>›</b>

                </button>


                <button class="config-button">

                    <span>
                        🌐
                    </span>

                    <div>
                        <strong>Alterar Idioma</strong>
                        <small>
                            Escolhe o idioma da aplicação
                        </small>
                    </div>

                    <b>›</b>

                </button>


                <button class="config-button apagar">

                    <span>
                        🗑️
                    </span>

                    <div>
                        <strong>Apagar Conta</strong>
                        <small>
                            Elimina permanentemente a tua conta
                        </small>
                    </div>

                    <b>›</b>

                </button>

            </div>

        </section>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const form = document.getElementById("formu");

            const botao = document.getElementById("formInfo");

            const cancelar = document.getElementById("cancelar");

            const nomeInfo = document.getElementById("nomeInfo");

            const emailInfo = document.getElementById("emailInfo");

            const nomeInput = document.getElementById("nome");

            const emailInput = document.getElementById("email");


            /* Abrir formulário */

            botao.addEventListener("click", function () {

                form.style.display = "block";

                botao.style.display = "none";

                document.getElementById("dadosUtilizador").style.display = "none";

            });


            /* Cancelar */

            cancelar.addEventListener("click", function () {

                form.style.display = "none";

                botao.style.display = "block";

                document.getElementById("dadosUtilizador").style.display = "block";

            });


            /* Guardar */

            form.addEventListener("submit", function (event) {

                event.preventDefault();


                const nome = nomeInput.value.trim();

                const email = emailInput.value.trim();


                if (nome === "" || email === "") {

                    alert("Preenche todos os campos.");

                    return;

                }


                nomeInfo.textContent = nome;

                emailInfo.textContent = email;


                form.style.display = "none";

                botao.style.display = "block";

                document.getElementById("dadosUtilizador").style.display = "block";


                alert("Informações atualizadas com sucesso!");

            });

        });

    </script>

</body>

</html>
