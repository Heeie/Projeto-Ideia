<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos</title>
    <link rel="stylesheet" href="css/amigos.css">
     <script src="Javascript/Amigos.js" defer></script>
</head>

<body>

      <div id="lateral">

            <img id="lampada"
             src="images/lampada-de-ideia.png"
             alt="Lampada"
             onclick="location.href='body.html'">
              <br><br> <br><br> <br><br><br><br> <br><br>

            <button class="btnLateral" id="amigosPage">Amigos</button>
            <br><br><br>
            <button class="btnLateral" id="pesquisaPage">Pesquisar Utilizador</button>
             <br><br><br>
            <button class="btnLateral" id="pedidosPage">Pedidos de Amizade</button>
             <br><br><br>
            
        </div>

        <div id="Principal">


            <div id="Amigos">
                <div class="barraPesq">
                    <form id="barraPesquisa">
                        <input type="text" id="nomeA" name="nomeAmigo" placeholder="Escreva um nome">
                        <input class="pesquisa" type="submit" value="Pesquisar">
                    </form>
                </div>
                <h1 class="Titulo">Lista de Amigos</h1>
                <div class="ListAmigos">
                    <div class="amigoConta">
                        <h2>Nome</h2>
                        <p>Estado: Online</p>
                        <button>Remover</button>
                    </div>
                </div>
            </div>


            <div id="PesquisarAmigo">
                <div class="barraPesq">
                    <form class="barraPesquisa">
                        <input type="text" id="nomeU" name="nomeUtilizador" placeholder="Procure por um nome">
                        <input class="pesquisa" type="submit" value="Pesquisar">
                    </form>
                </div>
                <h1 class="Titulo">Utilizadores Encontrados</h1>
                <div class="ListAmigos">
                    <div class="amigoConta">
                        <h2>Nome</h2>
                        <p>Estado: Online</p>
                        <button>Remover</button>
                    </div>
                </div>


            </div>

            <div id="PedidoAmizade">
                 
                <h1 class="Titulo">Pedidos de Amizade</h1>
                <div class="ListAmigos">

                    <div class="amigoPedido">
                        <h2>Nome</h2>
                        <button id="aceitarBtn">Aceitar</button>
                        <button id="recusarBtn">Recusar</button>
                    </div>
                </div>

            </div>

            
        </div>

</body>
</html>
